<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SleepyVolume</title>
    <meta
      name="description"
      content="Listen quieter than your phone’s lowest volume. Built for sleep and late-night listening."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-deep: #0b1220;
        --bg-mid: #152238;
        --ink: #e8eef8;
        --muted: #9aa8bd;
        --accent: #6ec8c0;
        --accent-deep: #3a9e96;
        --glow: rgba(110, 200, 192, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: Outfit, system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 700px at 70% -10%, #243755 0%, transparent 55%),
          radial-gradient(900px 500px at -10% 90%, #1a3a42 0%, transparent 50%),
          linear-gradient(165deg, var(--bg-deep), var(--bg-mid) 55%, #0e1828);
        overflow-x: hidden;
      }

      .scene {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2.5rem 1.25rem 3rem;
        position: relative;
      }

      .scene::before {
        content: "";
        position: absolute;
        inset: 12% auto auto 50%;
        width: min(70vw, 520px);
        height: min(70vw, 520px);
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(circle, var(--glow), transparent 68%);
        pointer-events: none;
        animation: breathe 7s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: translateX(-50%) scale(1);
        }
        50% {
          opacity: 0.95;
          transform: translateX(-50%) scale(1.06);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .panel {
        width: min(100%, 40rem);
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .brand {
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(2.6rem, 9vw, 4.4rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 0.95;
        margin: 0 0 1rem;
        animation: rise 0.8s ease both;
      }

      .tag {
        margin: 0 auto 2rem;
        max-width: 28rem;
        font-size: 1.05rem;
        line-height: 1.55;
        color: var(--muted);
        animation: rise 0.8s ease 0.12s both;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        padding: 0.95rem 1.35rem;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--accent-deep));
        color: #06201e;
        text-decoration: none;
        font-weight: 600;
        letter-spacing: 0.01em;
        box-shadow: 0 10px 30px rgba(58, 158, 150, 0.28);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        animation: rise 0.8s ease 0.22s both;
      }

      .cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 34px rgba(58, 158, 150, 0.38);
      }

      .cta svg {
        width: 1.25rem;
        height: 1.25rem;
      }

      .foot {
        margin-top: 2.25rem;
        font-size: 0.9rem;
        color: #7f8ea3;
        animation: rise 0.8s ease 0.32s both;
      }

      .foot a {
        color: var(--accent);
        text-decoration: none;
      }

      .foot a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="panel">
        <h1 class="brand">SleepyVolume</h1>
        <p class="tag">
          Quieter than your phone’s lowest volume — made for sleep and late-night listening.
        </p>
        <a
          class="cta"
          href="https://play.google.com/store/apps/details?id=com.sleepyvolume.app"
          rel="noopener"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M3.6 2.8 14.2 12 3.6 21.2V2.8Zm12.1 7.4 2.4-1.3 3.3 1.9-3.3 1.9-2.4-1.3Zm-1.7 1 2.7 2.7-8.6 4.8 5.9-7.5Zm0 1.6L8.1 5.3l8.6 4.8-2.7 2.7Z"
            />
          </svg>
          Get it on Google Play
        </a>
        <p class="foot">
          <a href="/privacy-policy.txt">Privacy Policy</a>
        </p>
      </div>
    </main>
  </body>
</html>
